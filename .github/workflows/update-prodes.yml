name: "Atualização Anual — PRODES Cerrado"

# Executa todo dia 1º de outubro às 03:00 UTC (INPE publica PRODES em outubro)
# Também pode ser disparado manualmente — recomendado após anúncio do INPE.
on:
  schedule:
    - cron: "0 3 1 10 *"
  workflow_dispatch:
    inputs:
      force_download:
        description: "Forçar download mesmo que PRODES exista (true/false)"
        required: false
        default: "false"
      anos_prodes:
        description: "Ciclos PRODES a processar (ex: 2023 2024 2025)"
        required: false
        default: ""

concurrency:
  group: update-prodes
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

jobs:
  update-prodes:
    name: "Download PRODES WFS → Pipeline → Upload"
    runs-on: ubuntu-latest
    timeout-minutes: 90   # Download WFS PRODES pode demorar 20-40 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: desmatamento
          environment-file: environment.yml
          use-mamba: true
          miniforge-version: latest

      - name: Criar .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            > .env
          chmod 600 .env

      # ── Download PRODES via WFS TerraBrasilis ──────────────────────────────
      # Endpoint verificado ativo em 2026-05-19
      # Layer: prodes-cerrado-nb:yearly_deforestation
      # Estratégia: bbox Piauí + CQL_FILTER por ano (evita baixar 1 GB)
      - name: Download PRODES Cerrado (WFS TerraBrasilis)
        run: |
          PRODES_OUT="base de dados/PRODES_Cerrado_PI.geojson"
          FORCE="${{ github.event.inputs.force_download }}"

          if [ -f "$PRODES_OUT" ] && [ "$FORCE" != "true" ]; then
            echo "PRODES já existe — pulando download (use force_download=true para atualizar)"
            exit 0
          fi

          echo "Executando download PRODES WFS..."
          conda run -n desmatamento python pipeline/_baixar_prodes.py

      - name: Verificar PRODES baixado
        run: |
          python -c "
          from pathlib import Path
          p = Path('base de dados/PRODES_Cerrado_PI.geojson')
          if not p.exists():
              raise SystemExit('PRODES não encontrado')
          import json
          data = json.loads(p.read_text(encoding='utf-8'))
          n = len(data.get('features', []))
          print(f'✓ PRODES: {n} polígonos ({p.stat().st_size/1e6:.1f} MB)')
          if n == 0:
              raise SystemExit('PRODES sem polígonos — verificar WFS TerraBrasilis')
          "

      # ── Dados de entrada (alertas + ASVs + DERADSAs) ──────────────────────
      - name: Download DERADSAs do Supabase Storage
        run: conda run -n desmatamento python pipeline/_baixar_deradsa_storage.py
        continue-on-error: true

      - name: Verificar alertas MapBiomas e ASVs
        run: |
          python -c "
          from pathlib import Path
          for f in [
            'base de dados/Alertas de Desmatamento(MAPBIOMAS).geojson',
            'base de dados/ASVs Emitidas-PI(SINAFLOR+).geojson',
          ]:
              p = Path(f)
              if not p.exists():
                  raise SystemExit(f'FALTANDO: {f}\nExecute update-alertas.yml primeiro.')
              print(f'✓ {p.name}')
          "

      # ── Executar pipeline completo ─────────────────────────────────────────
      - name: Executar Pipeline v2 (com validação PRODES)
        run: conda run -n desmatamento python -m pipeline

      - name: Upload para Supabase
        run: conda run -n desmatamento python pipeline/_upload_supabase.py

      # ── Gerar documentação técnica atualizada ─────────────────────────────
      - name: Gerar documentação técnica
        run: |
          if [ -f "_gerar_documentacao.py" ]; then
            conda run -n desmatamento python _gerar_documentacao.py
            echo "✓ Documentação atualizada"
          fi
        continue-on-error: true

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodes-update-${{ github.run_number }}
          path: |
            Resultado/pipeline.log
            Resultado/agregado_municipios.json
            Resultado/*.docx
          retention-days: 90   # Relatórios PRODES mantidos por 3 meses

      - name: Resumo da execução
        if: always()
        run: |
          echo "## Atualização PRODES Cerrado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "Resultado/pipeline.log" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(ETAPA|✓|IRREGULAR|CONCORDANTE|testes)" Resultado/pipeline.log \
              | tail -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
