name: "Atualização Anual — PRODES Cerrado"

# Executa todo dia 1º de outubro às 03:00 UTC (INPE publica PRODES em outubro)
# Também pode ser disparado manualmente — recomendado após anúncio do INPE.
on:
  schedule:
    - cron: "0 3 1 10 *"
  workflow_dispatch:
    inputs:
      force_download:
        description: "Forçar download mesmo que PRODES exista (true/false)"
        required: false
        default: "false"
      anos_prodes:
        description: "Ciclos PRODES a processar (ex: 2023 2024 2025)"
        required: false
        default: ""

concurrency:
  group: update-prodes
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

jobs:
  update-prodes:
    name: "Download PRODES WFS → Pipeline → Upload"
    runs-on: ubuntu-latest
    timeout-minutes: 90   # Download WFS PRODES pode demorar 20-40 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: desmatamento
          environment-file: environment.yml
          use-mamba: true
          miniforge-version: latest

      - name: Criar .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            > .env
          chmod 600 .env

      # ── Download PRODES via WFS TerraBrasilis ──────────────────────────────
      # Endpoint verificado ativo em 2026-05-19
      # Layer: prodes-cerrado-nb:yearly_deforestation
      # Estratégia: bbox Piauí + CQL_FILTER por ano (evita baixar 1 GB)
      - name: Download PRODES Cerrado (WFS TerraBrasilis)
        run: |
          PRODES_OUT="data/raw/PRODES_Cerrado_PI.geojson"
          FORCE="${{ github.event.inputs.force_download }}"

          if [ -f "$PRODES_OUT" ] && [ "$FORCE" != "true" ]; then
            echo "PRODES já existe — pulando download (use force_download=true para atualizar)"
            exit 0
          fi

          echo "Executando download PRODES WFS..."
          conda run -n desmatamento python scripts/_baixar_prodes.py

      - name: Verificar PRODES baixado
        run: |
          python -c "
          from pathlib import Path
          p = Path('data/raw/PRODES_Cerrado_PI.geojson')
          if not p.exists():
              raise SystemExit('PRODES não encontrado')
          import json
          data = json.loads(p.read_text(encoding='utf-8'))
          n = len(data.get('features', []))
          print(f'✓ PRODES: {n} polígonos ({p.stat().st_size/1e6:.1f} MB)')
          if n == 0:
              raise SystemExit('PRODES sem polígonos — verificar WFS TerraBrasilis')
          "

      # ── Dados de entrada (alertas + ASVs + DERADSAs) ──────────────────────
      - name: Download DERADSAs do Supabase Storage
        run: conda run -n desmatamento python -m modules.deradsa_semarh.downloader
        continue-on-error: true

      - name: Verificar alertas MapBiomas e ASVs
        run: |
          python -c "
          from pathlib import Path
          for f in [
            'data/raw/Alertas de Desmatamento(MAPBIOMAS).geojson',
            'data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson',
          ]:
              p = Path(f)
              if not p.exists():
                  raise SystemExit(f'FALTANDO: {f}\nExecute update-alertas.yml primeiro.')
              print(f'✓ {p.name}')
          "

      # ── Executar pipeline completo ─────────────────────────────────────────
      - name: Executar Orquestrador v2 (com validação PRODES)
        run: conda run -n desmatamento python -m core.orchestrator

      # ── Gerar documentação técnica atualizada ─────────────────────────────
      - name: Gerar documentação técnica
        run: |
          if [ -f "scripts/_gerar_documentacao.py" ]; then
            conda run -n desmatamento python scripts/_gerar_documentacao.py
            echo "✓ Documentação atualizada"
          fi
        continue-on-error: true

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodes-update-${{ github.run_number }}
          path: |
            data/output/pipeline.log
            data/output/agregado_municipios.json
            data/output/*.docx
          retention-days: 90   # Relatórios PRODES mantidos por 3 meses

      - name: Resumo da execução
        if: always()
        run: |
          echo "## Atualização PRODES Cerrado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/output/pipeline.log" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(ETAPA|✓|IRREGULAR|CONCORDANTE|testes)" data/output/pipeline.log \
              | tail -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # ── Notificações por e-mail ──────────────────────────────────────────
      - name: Preparar e-mail de resultado
        if: always() && !cancelled()
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p data/output
          python3 scripts/gerar_email.py || echo "⚠ Geração do e-mail falhou — fallback para texto plano"
          if [ -f data/output/email_body.html ]; then
            echo "EMAIL_HTML_BODY<<HTMLEOF" >> $GITHUB_ENV
            cat data/output/email_body.html >> $GITHUB_ENV
            echo "HTMLEOF" >> $GITHUB_ENV
          fi

      - name: "📧 E-mail: PRODES atualizado"
        if: success() && env.PIPELINE_STATUS == 'ok'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "✅ PRODES atualizado — validação anual concluída | ${{ env.PIPELINE_N_ALERTAS }} fragmentos (PI)"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "Pipeline PRODES Cerrado executado com sucesso. Validação anual disponível no dashboard. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📧 E-mail: PRODES com avisos"
        if: success() && env.PIPELINE_STATUS == 'warning'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "⚠️ PRODES com avisos — validação concluída com ressalvas"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "Pipeline PRODES concluído com avisos. Verificar módulos com warning. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📧 E-mail: falha no pipeline PRODES"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "🚨 FALHA — Pipeline PRODES Cerrado (run #${{ github.run_number }})"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "O pipeline de validação PRODES falhou. Verificação anual comprometida. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
