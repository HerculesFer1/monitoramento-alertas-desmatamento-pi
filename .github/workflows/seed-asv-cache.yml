name: "Seed ASV cache (one-shot)"

# Sobe um arquivo GeoJSON de ASV para o bucket `asv-cache` do Supabase Storage,
# usado como fallback quando os endpoints do IBAMA/SINAFLOR ficam fora do ar.
#
# Uso: workflow_dispatch manual apontando um asset de um GitHub Release.
# Depois de rodar com sucesso uma vez, a cache passa a ser mantida
# automaticamente pelo modules.asvs_sinaflor.downloader em toda run OK do IBAMA.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag do release que contém o asset ASV"
        required: true
        default: "asv-cache-seed-2026-07-06"
      asset_name:
        description: "Nome do asset dentro do release (arquivo local a baixar)"
        required: true
        default: "asv-latest.geojson"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Baixar asset ASV do release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.inputs.release_tag }}" \
            --pattern "${{ github.event.inputs.asset_name }}" \
            --output asv-seed.geojson
          ls -la asv-seed.geojson
          echo "n_bytes=$(stat -c%s asv-seed.geojson)"
          python3 -c "
          import json
          d = json.load(open('asv-seed.geojson', encoding='utf-8'))
          print('type:', d.get('type'))
          print('features:', len(d.get('features', [])))
          "

      - name: Upload para Supabase Storage (bucket asv-cache)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Storage REST API: POST /storage/v1/object/{bucket}/{path}
          # Usamos x-upsert:true para poder rodar o workflow de novo sem erro.
          HTTP=$(curl -s -o resp.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/storage/v1/object/asv-cache/latest.geojson" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@asv-seed.geojson")
          echo "HTTP status: $HTTP"
          cat resp.txt; echo
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::error::Upload falhou (HTTP $HTTP)"
            exit 1
          fi

      - name: Verificar objeto no bucket
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -o downloaded.geojson -w "download HTTP: %{http_code}\n" \
            "$SUPABASE_URL/storage/v1/object/asv-cache/latest.geojson" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY"
          ls -la downloaded.geojson
          python3 -c "
          import json
          d = json.load(open('downloaded.geojson', encoding='utf-8'))
          print('  seed OK — type:', d.get('type'), '  features:', len(d.get('features', [])))
          "

      - name: Resumo
        run: |
          echo '## Seed ASV cache — CONCLUÍDO' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Arquivo `latest.geojson` disponível em `asv-cache` bucket.' >> $GITHUB_STEP_SUMMARY
          echo 'Próxima queda do IBAMA vai usar essa cópia como fallback automaticamente.' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Depois de confirmar que o `update-alertas` rodou OK, você pode:' >> $GITHUB_STEP_SUMMARY
          echo '- Deletar este workflow (`.github/workflows/seed-asv-cache.yml`)' >> $GITHUB_STEP_SUMMARY
          echo '- Deletar o release temporário (`${{ github.event.inputs.release_tag }}`)' >> $GITHUB_STEP_SUMMARY
