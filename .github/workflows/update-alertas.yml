name: "Atualização Mensal — MapBiomas Alertas"

# Executa todo dia 5 de cada mês às 03:00 UTC (meia-noite, horário de Brasília)
# Também pode ser disparado manualmente com opções de filtro.
on:
  schedule:
    - cron: "0 3 5 * *"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a baixar (ex: 2024 2025) — vazio = todos"
        required: false
        default: ""
      dry_run:
        description: "Processar pipeline sem fazer upload (true/false)"
        required: false
        default: "false"

concurrency:
  group: update-alertas
  cancel-in-progress: false  # aguarda run em andamento; não cancela upload em progresso

env:
  PYTHONUTF8: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

jobs:
  update-alertas:
    name: "Baixar → Pipeline → Upload"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Ambiente Conda com geopandas ───────────────────────────────────
      - name: Setup Miniconda (mamba solver)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: desmatamento
          environment-file: environment.yml
          use-mamba: true
          miniforge-version: latest

      # ── 3. Autenticar no MapBiomas e criar .env ──────────────────────────
      - name: Autenticar MapBiomas + criar .env
        run: |
          MAPBIOMAS_TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { signIn(email: \\\"${{ secrets.MAPBIOMAS_EMAIL }}\\\" password: \\\"${{ secrets.MAPBIOMAS_PASSWORD }}\\\") { token } }\"}" \
            "https://plataforma.alerta.mapbiomas.org/api/v2/graphql" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['signIn']['token'])")
          echo "::add-mask::$MAPBIOMAS_TOKEN"
          echo "MAPBIOMAS_TOKEN=$MAPBIOMAS_TOKEN" >> $GITHUB_ENV
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "MAPBIOMAS_TOKEN=$MAPBIOMAS_TOKEN" \
            > .env
          chmod 600 .env

      # ── 4. Download DERADSAs do Supabase Storage ──────────────────────────
      - name: Download DERADSAs (Supabase Storage)
        run: |
          conda run -n desmatamento python -m modules.deradsa_semarh.downloader --anos 2024 2025
        continue-on-error: true   # Pipeline continua mesmo sem DERADSAs

      # ── 5. Download alertas MapBiomas ─────────────────────────────────────
      - name: Download MapBiomas Alertas
        run: |
          ANOS_ARG=""
          if [ -n "${{ github.event.inputs.anos }}" ]; then
            ANOS_ARG="--anos ${{ github.event.inputs.anos }}"
          fi
          conda run -n desmatamento python -m modules.alertas_mapbiomas.downloader $ANOS_ARG

      # ── 6. Download ASVs SINAFLOR ─────────────────────────────────────────
      - name: Download ASVs SINAFLOR
        run: conda run -n desmatamento python -m modules.asvs_sinaflor.downloader
        continue-on-error: true   # Usa arquivo existente se WFS indisponível

      # ── 7. Verificar dados de entrada ─────────────────────────────────────
      - name: Verificar arquivos de entrada
        run: |
          python -c "
          from pathlib import Path
          arquivos = [
            'data/raw/Alertas de Desmatamento(MAPBIOMAS).geojson',
            'data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson',
          ]
          ok = True
          for f in arquivos:
              p = Path(f)
              if p.exists():
                  print(f'✓ {p.name} ({p.stat().st_size/1e6:.1f} MB)')
              else:
                  print(f'✗ AUSENTE: {f}')
                  ok = False
          if not ok:
              raise SystemExit('Arquivos obrigatórios ausentes')
          "

      # ── 8. Executar pipeline (classify + aggregate + upload) ──────────────
      - name: Executar Orquestrador v2
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          conda run -n desmatamento python -m core.orchestrator $DRY_RUN_FLAG

      # ── 9. Salvar artefatos da execução ───────────────────────────────────
      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            data/output/pipeline.log
            data/output/agregado_municipios.json
          retention-days: 30

      # ── 10. Preparar + enviar e-mail de resultado ────────────────────────
      - name: Preparar e-mail de resultado
        if: always() && !cancelled()
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p data/output
          python3 scripts/gerar_email.py || echo "⚠ Geração do e-mail falhou — fallback para texto plano"
          # Exportar HTML para GITHUB_ENV (permite referência em passos seguintes)
          if [ -f data/output/email_body.html ]; then
            echo "EMAIL_HTML_BODY<<HTMLEOF" >> $GITHUB_ENV
            cat data/output/email_body.html >> $GITHUB_ENV
            echo "HTMLEOF" >> $GITHUB_ENV
          fi

      - name: "📧 E-mail: dados atualizados"
        if: success() && env.PIPELINE_STATUS == 'ok'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "✅ Dados atualizados — ${{ env.PIPELINE_N_ALERTAS }} fragmentos | ${{ env.PIPELINE_N_MUN }} municípios (PI)"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "Pipeline de alertas de desmatamento executado com sucesso. Ver logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📧 E-mail: atualizado com avisos"
        if: success() && env.PIPELINE_STATUS == 'warning'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "⚠️ Pipeline com avisos — ${{ env.PIPELINE_N_ALERTAS }} fragmentos | verificar módulos"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "Pipeline concluído com avisos — alguns módulos usaram cache ou tiveram degradação parcial. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📧 E-mail: falha crítica"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "🚨 FALHA CRÍTICA — Pipeline MapBiomas (run #${{ github.run_number }})"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "O pipeline de alertas de desmatamento FALHOU. Intervenção manual necessária. Ver logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
