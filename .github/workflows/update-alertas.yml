name: "Atualização Mensal — MapBiomas Alertas"

# Executa todo dia 5 de cada mês às 03:00 UTC (meia-noite, horário de Brasília)
# Também pode ser disparado manualmente com opções de filtro.
on:
  schedule:
    - cron: "0 3 5 * *"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a baixar (ex: 2024 2025) — vazio = todos"
        required: false
        default: ""
      dry_run:
        description: "Processar pipeline sem fazer upload (true/false)"
        required: false
        default: "false"

concurrency:
  group: update-alertas
  cancel-in-progress: false  # aguarda run em andamento; não cancela upload em progresso

env:
  PYTHONUTF8: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

jobs:
  update-alertas:
    name: "Baixar → Pipeline → Upload"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5

      # ── 1b. Validar secrets obrigatorios (early-fail com msg clara) ──
      - name: Validar secrets obrigatorios
        run: |
          set -eu
          missing=""
          for s in SUPABASE_URL SUPABASE_SERVICE_KEY SUPABASE_ANON_KEY MAPBIOMAS_EMAIL MAPBIOMAS_PASSWORD; do
            v="$(eval echo \"\${$s:-}\")"
            if [ -z "$v" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes:$missing"
            echo "## ❌ Secrets ausentes no repositório" >> "$GITHUB_STEP_SUMMARY"
            echo "Verifique em Settings → Secrets and variables → Actions:" >> "$GITHUB_STEP_SUMMARY"
            for s in $missing; do echo "- \`$s\`" >> "$GITHUB_STEP_SUMMARY"; done
            exit 1
          fi
          echo "✓ Todos os secrets obrigatórios estão presentes"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBIOMAS_EMAIL:      ${{ secrets.MAPBIOMAS_EMAIL }}
          MAPBIOMAS_PASSWORD:   ${{ secrets.MAPBIOMAS_PASSWORD }}

      # ── 2. Ambiente Conda com geopandas ───────────────────────────────────
      - name: Setup Miniconda (mamba solver)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: desmatamento
          environment-file: environment.yml
          use-mamba: true
          miniforge-version: latest

      # ── 3. Autenticar no MapBiomas e criar .env (com diagnostico) ───────
      - name: Autenticar MapBiomas + criar .env
        env:
          MAPBIOMAS_EMAIL:    ${{ secrets.MAPBIOMAS_EMAIL }}
          MAPBIOMAS_PASSWORD: ${{ secrets.MAPBIOMAS_PASSWORD }}
        run: |
          set -eu
          RESP=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { signIn(email: \\\"$MAPBIOMAS_EMAIL\\\" password: \\\"$MAPBIOMAS_PASSWORD\\\") { token } }\"}" \
            "https://plataforma.alerta.mapbiomas.org/api/v2/graphql")

          # Diagnostico claro se o login falhar
          MAPBIOMAS_TOKEN=$(echo "$RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if 'errors' in d:
              print('::error::MapBiomas retornou erros: ' + json.dumps(d['errors']), file=sys.stderr)
              sys.exit(1)
          tok = (d.get('data') or {}).get('signIn', {}) and (d.get('data') or {}).get('signIn', {}).get('token')
          if not tok:
              print('::error::MapBiomas não retornou token. Resposta: ' + json.dumps(d)[:400], file=sys.stderr)
              sys.exit(1)
          print(tok)
          ")
          echo "::add-mask::$MAPBIOMAS_TOKEN"
          echo "MAPBIOMAS_TOKEN=$MAPBIOMAS_TOKEN" >> $GITHUB_ENV
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "MAPBIOMAS_TOKEN=$MAPBIOMAS_TOKEN" \
            > .env
          chmod 600 .env
          echo "✓ Token MapBiomas obtido e .env criado"

      # ── 4. Download DERADSAs do Supabase Storage ──────────────────────────
      - name: Download DERADSAs (Supabase Storage)
        run: |
          conda run -n desmatamento python -m modules.deradsa_semarh.downloader --anos 2024 2025
        continue-on-error: true   # Pipeline continua mesmo sem DERADSAs

      # ── 5. Download alertas MapBiomas ─────────────────────────────────────
      - name: Download MapBiomas Alertas
        run: |
          ANOS_ARG=""
          if [ -n "${{ github.event.inputs.anos }}" ]; then
            ANOS_ARG="--anos ${{ github.event.inputs.anos }}"
          fi
          conda run -n desmatamento python -m modules.alertas_mapbiomas.downloader $ANOS_ARG

      # ── 6. Download ASVs SINAFLOR ─────────────────────────────────────────
      - name: Download ASVs SINAFLOR
        run: conda run -n desmatamento python -m modules.asvs_sinaflor.downloader
        continue-on-error: true   # Usa arquivo existente se WFS indisponível

      # ── 7. Verificar dados de entrada ─────────────────────────────────────
      - name: Verificar arquivos de entrada
        run: |
          python -c "
          from pathlib import Path
          arquivos = [
            'data/raw/Alertas de Desmatamento(MAPBIOMAS).geojson',
            'data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson',
          ]
          ok = True
          for f in arquivos:
              p = Path(f)
              if p.exists():
                  print(f'✓ {p.name} ({p.stat().st_size/1e6:.1f} MB)')
              else:
                  print(f'✗ AUSENTE: {f}')
                  ok = False
          if not ok:
              raise SystemExit('Arquivos obrigatórios ausentes')
          "

      # ── 8. Executar pipeline (classify + aggregate + upload) ──────────────
      - name: Executar Orquestrador v2
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          DRY_RUN_FLAG=""
          if [ "${DRY_RUN_INPUT:-}" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi

          # Sanity check anti-no-op (mesmo padrão de update-queimadas.yml).
          # Causa raiz histórica: orchestrator pode terminar com exit 0 sem
          # processar nada se um pré-requisito está ausente. Detectamos
          # via stdout em vez de confiar no exit code.
          LOG=$(mktemp)
          conda run -n desmatamento python -m core.orchestrator $DRY_RUN_FLAG 2>&1 | tee "$LOG"
          STATUS="${PIPESTATUS[0]}"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Orchestrator falhou com exit code $STATUS"
            exit "$STATUS"
          fi
          # Em dry-run não há upload, então pulamos a no-op check.
          if [ -z "$DRY_RUN_FLAG" ]; then
            if ! grep -qE "inseridos/atualizados|concluído em [0-9]+\.[0-9]+s" "$LOG"; then
              echo "::error::Orchestrator terminou sem evidência de upload — provável no-op silencioso."
              tail -30 "$LOG"
              exit 1
            fi
          fi

      # ── 9. Salvar artefatos da execução ───────────────────────────────────
      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            data/output/pipeline.log
            data/output/agregado_municipios.json
          retention-days: 30

      # ── 10. Resumo da execução (GitHub Actions Summary) ─────────────────
      # O GitHub envia este sumário no e-mail de falha que ele dispara
      # automaticamente — configure em github.com → Settings → Notifications.
      - name: Resumo da execução
        if: always()
        run: |
          STATUS="${PIPELINE_STATUS:-desconhecido}"
          case "$STATUS" in
            ok)      ICONE="✅" ; LABEL="CONCLUÍDO" ;;
            warning) ICONE="⚠️" ; LABEL="COM AVISOS" ;;
            error)   ICONE="🚨" ; LABEL="COM ERROS"  ;;
            *)       ICONE="❓" ; LABEL="DESCONHECIDO" ;;
          esac

          {
            echo "## $ICONE Pipeline MapBiomas Alertas — $LABEL"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Fragmentos detectados | ${PIPELINE_N_ALERTAS:-—} |"
            echo "| Municípios afetados   | ${PIPELINE_N_MUN:-—} |"
            echo "| Duração               | ${PIPELINE_DURACAO:-—}s |"
            echo "| Run                   | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            if [ -n "$PIPELINE_RESUMO_MODULOS" ]; then
              echo "### Módulos"
              echo '```'
              echo "$PIPELINE_RESUMO_MODULOS"
              echo '```'
            fi
            if [ -n "$PIPELINE_AVISOS" ] && [ "$PIPELINE_AVISOS" != "Nenhum" ]; then
              echo "### ⚠ Avisos"
              echo '```'
              echo "$PIPELINE_AVISOS"
              echo '```'
            fi
            if [ -n "$PIPELINE_ERROS" ] && [ "$PIPELINE_ERROS" != "Nenhum" ]; then
              echo "### 🚨 Erros"
              echo '```'
              echo "$PIPELINE_ERROS"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
