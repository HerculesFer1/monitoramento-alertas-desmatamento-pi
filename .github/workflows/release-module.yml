name: Release Module

on:
  workflow_dispatch:
    inputs:
      module_id:
        description: 'ID do módulo (ex: alertas_mapbiomas, prodes_cerrado)'
        required: true
        type: string
      version:
        description: 'Versão semântica (ex: 2.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — validar sem criar tag'
        required: false
        default: 'false'
        type: boolean

jobs:
  validate-and-release:
    name: Validar e Publicar Módulo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pytest geopandas shapely pandas numpy requests

      - name: Verificar existência do módulo
        run: |
          MODULE_DIR="modules/${{ inputs.module_id }}"
          if [ ! -d "$MODULE_DIR" ]; then
            echo "ERRO: módulo '${{ inputs.module_id }}' não encontrado em $MODULE_DIR"
            exit 1
          fi
          for f in manifest.py; do
            if [ ! -f "$MODULE_DIR/$f" ]; then
              echo "ERRO: $MODULE_DIR/$f ausente"
              exit 1
            fi
          done
          echo "OK: módulo '${{ inputs.module_id }}' encontrado"

      - name: Validar manifest
        run: |
          python -c "
          import importlib.util, sys, pathlib
          manifest = pathlib.Path('modules/${{ inputs.module_id }}/manifest.py')
          spec = importlib.util.spec_from_file_location('manifest', manifest)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          m = mod.MODULE_MANIFEST
          required = {'id', 'name', 'version', 'priority', 'enabled', 'schedule', 'outputs'}
          missing = required - set(m.keys())
          if missing:
              print(f'ERRO: chaves ausentes: {missing}')
              sys.exit(1)
          if m['version'] != '${{ inputs.version }}':
              print(f'AVISO: versão no manifest ({m[\"version\"]}) difere da input (${{ inputs.version }})')
          print(f'OK: {m[\"id\"]} v{m[\"version\"]} — {m[\"name\"]}')
          "

      - name: Executar testes do módulo
        run: |
          pytest modules/${{ inputs.module_id }}/tests/ -v --tb=short

      - name: Criar tag de release
        if: inputs.dry_run != 'true'
        run: |
          TAG="module/${{ inputs.module_id }}/v${{ inputs.version }}"
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "Release ${{ inputs.module_id }} v${{ inputs.version }}"
          git push origin "$TAG"
          echo "Tag criada: $TAG"

      - name: Dry run — sem tag
        if: inputs.dry_run == 'true'
        run: |
          echo "DRY RUN: tag 'module/${{ inputs.module_id }}/v${{ inputs.version }}' NÃO foi criada"
          echo "Todos os testes passaram — pronto para release real"
