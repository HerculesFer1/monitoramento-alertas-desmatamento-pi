name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  # ── 1. Build do frontend React/TypeScript ─────────────────────────────────
  frontend-build:
    name: Frontend — TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Build de produção (tsc + vite)
        run: npm run build

  # ── 2. Lint do pipeline Python ────────────────────────────────────────────
  python-lint:
    name: Python — ruff lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ruff
        run: pip install ruff

      - name: Lint core/ modules/
        run: ruff check core/ modules/ --select E,F,W,I --ignore E501

      - name: Verificar sintaxe de todos os módulos
        run: |
          python -c "
          import ast, pathlib, sys
          dirs = [pathlib.Path('core'), pathlib.Path('modules')]
          files = [f for d in dirs for f in d.rglob('*.py') if '__pycache__' not in str(f)]
          print(f'Verificando {len(files)} arquivos...')
          for f in files:
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  print(f'ERRO de sintaxe em {f}: {e}')
                  sys.exit(1)
          print('Sintaxe OK em todos os módulos')
          "

      - name: Validar manifests dos módulos
        run: |
          python -c "
          import importlib, pathlib, sys
          required = {'id', 'name', 'version', 'priority', 'enabled', 'schedule', 'outputs'}
          errors = []
          for manifest in pathlib.Path('modules').glob('*/manifest.py'):
              mod_name = str(manifest.parent).replace('/', '.').replace('\\\\', '.')
              try:
                  spec = importlib.util.spec_from_file_location(mod_name + '.manifest', manifest)
                  mod = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(mod)
                  m = getattr(mod, 'MODULE_MANIFEST', None)
                  if m is None:
                      errors.append(f'{manifest}: MODULE_MANIFEST ausente')
                  else:
                      missing = required - set(m.keys())
                      if missing:
                          errors.append(f'{manifest}: chaves ausentes {missing}')
                      else:
                          print(f'OK: {manifest.parent.name} v{m[\"version\"]} prio={m[\"priority\"]}')
              except Exception as e:
                  errors.append(f'{manifest}: {e}')
          if errors:
              for e in errors:
                  print(f'ERRO: {e}')
              sys.exit(1)
          print(f'Todos os manifests validados.')
          "

  # ── 3. Testes unitários Python ───────────────────────────────────────────
  python-tests:
    name: Python — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pytest geopandas shapely pandas numpy requests supabase python-dotenv

      - name: Executar testes unitários
        run: pytest tests/ -v --tb=short

  # ── 4. Validação dos arquivos SQL de migration ────────────────────────────
  sql-check:
    name: SQL — verificar migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar existência das migrations
        run: |
          for f in \
            infra/supabase/migrations/001_schema_inicial.sql \
            infra/supabase/migrations/002_matopiba_view.sql \
            infra/supabase/migrations/003_deradsa_management.sql \
            infra/supabase/migrations/004_prodes_rpc_fix.sql \
            infra/supabase/migrations/005_security_hardening.sql \
            infra/supabase/migrations/006_execucoes_pipeline_colunas.sql \
            infra/supabase/migrations/007_index_execucoes_pipeline.sql; do
            if [ ! -f "$f" ]; then
              echo "ERRO: Migration ausente: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Verificar que migrations não estão vazias
        run: |
          for f in infra/supabase/migrations/*.sql; do
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 5 ]; then
              echo "ERRO: Migration suspeita (< 5 linhas): $f"
              exit 1
            fi
            echo "OK: $f ($lines linhas)"
          done

  # ── 5. Schema check MapBiomas — detecta drift antes do agendamento mensal
  mapbiomas-schema-check:
    name: MapBiomas — contrato GraphQL (introspection)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências mínimas
        run: pip install requests

      - name: Verificar contrato com API MapBiomas Alerta v2
        run: python -m modules.alertas_mapbiomas.schema_check

  # ── 6. Verificar que constants.json está sincronizado ────────────────────
  constants-sync:
    name: Pipeline — constants.json sincronizado
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências mínimas
        run: pip install python-dotenv

      - name: Verificar que constants.json existe e é válido JSON
        run: |
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('pipeline/constants.json')
          if not p.exists():
              print('ERRO: pipeline/constants.json ausente')
              sys.exit(1)
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              required = ['anos', 'matopiba_pi', 'vp_ptbr', 'classes', 'threshold_autorizado']
              for k in required:
                  if k not in data:
                      print(f'ERRO: chave ausente em constants.json: {k}')
                      sys.exit(1)
              print(f'OK: constants.json válido — {len(data)} chaves, {len(data[\"matopiba_pi\"])} municípios MATOPIBA')
          except json.JSONDecodeError as e:
              print(f'ERRO: constants.json inválido: {e}')
              sys.exit(1)
          "

      - name: Verificar que constants.json está em sincronia com constants.py
        run: |
          python -c "
          import json, pathlib, sys
          committed = json.loads(pathlib.Path('pipeline/constants.json').read_text(encoding='utf-8'))
          sys.path.insert(0, '.')
          from core.constants import as_json_payload
          regenerated = as_json_payload()
          if committed != regenerated:
              print('ERRO: pipeline/constants.json desatualizado — execute python -m pipeline.constants e faca commit do resultado')
              diffs = [k for k in set(list(committed)+list(regenerated)) if committed.get(k) != regenerated.get(k)]
              print('Chaves divergentes:', diffs)
              sys.exit(1)
          print('OK: constants.json em sincronia com constants.py')
          "
