name: "Atualização Semanal — ASVs SINAFLOR"

# Executa toda segunda-feira às 03:00 UTC
# ASVs são emitidas continuamente — atualização semanal garante cobertura.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas baixa dados, não executa pipeline (true/false)"
        required: false
        default: "false"

concurrency:
  group: update-asvs
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

jobs:
  update-asvs:
    name: "Baixar ASVs → Pipeline → Upload"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: desmatamento
          environment-file: environment.yml
          use-mamba: true
          miniforge-version: latest

      - name: Criar .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            > .env
          chmod 600 .env

      - name: Download ASVs SINAFLOR
        id: download-asvs
        # continue-on-error: serviço IBAMA pode estar temporariamente indisponível.
        # O passo seguinte verifica se há dados (novos ou cache) e decide se prossegue.
        continue-on-error: true
        run: conda run -n desmatamento python -m modules.asvs_sinaflor.downloader

      - name: Verificar arquivo ASV
        run: |
          python -c "
          from pathlib import Path
          p = Path('data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson')
          if not p.exists():
              print('AVISO: ASVs não disponíveis (WFS IBAMA indisponível e sem cache).')
              print('O pipeline será interrompido — execute novamente quando o IBAMA estiver acessível.')
              raise SystemExit('ASVs não baixadas')
          import json
          data = json.loads(p.read_text(encoding='utf-8'))
          n = len(data.get('features', []))
          print(f'✓ {n} ASVs disponíveis')
          if n == 0:
              raise SystemExit('Nenhuma ASV retornada — verificar WFS IBAMA')
          if '${{ steps.download-asvs.outcome }}' == 'failure':
              print('AVISO: Download falhou mas arquivo de cache encontrado — usando dados anteriores.')
          "

      # Só re-executa o pipeline completo se os dados mudaram
      # (verifica hash do arquivo de ASVs)
      - name: Verificar se ASVs mudaram
        id: check-change
        run: |
          if [ -f "data/output/.last_asv_hash" ]; then
            OLD=$(cat data/output/.last_asv_hash)
            NEW=$(md5sum "data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson" | cut -d' ' -f1)
            if [ "$OLD" = "$NEW" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "ASVs sem mudança desde último download — pipeline não será re-executado"
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Download DERADSAs (Supabase Storage)
        if: steps.check-change.outputs.changed == 'true'
        run: conda run -n desmatamento python -m modules.deradsa_semarh.downloader
        continue-on-error: true

      - name: Download MapBiomas Alertas (reutilizar existente)
        if: steps.check-change.outputs.changed == 'true'
        run: |
          python -c "
          from pathlib import Path
          import time
          p = Path('data/raw/Alertas de Desmatamento(MAPBIOMAS).geojson')
          if p.exists():
              age_days = (time.time() - p.stat().st_mtime) / 86400
              print(f'Alertas existentes: {age_days:.1f} dias de idade')
              if age_days < 7:
                  print('Reutilizando arquivo existente (< 7 dias)')
              else:
                  print('Arquivo antigo (> 7 dias) — executar update-alertas.yml')
          else:
              raise SystemExit('ERRO: Alertas MapBiomas não encontrados. Execute update-alertas.yml primeiro.')
          "

      - name: Executar Orquestrador v2
        if: ${{ steps.check-change.outputs.changed == 'true' && github.event.inputs.dry_run != 'true' }}
        run: conda run -n desmatamento python -m core.orchestrator

      - name: Salvar hash das ASVs
        if: steps.check-change.outputs.changed == 'true'
        run: |
          mkdir -p data/output
          md5sum "data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson" | cut -d' ' -f1 > data/output/.last_asv_hash

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asv-update-${{ github.run_number }}
          path: data/output/pipeline.log
          retention-days: 14

      # ── Notificações por e-mail ──────────────────────────────────────────
      - name: Preparar e-mail de resultado
        if: always() && !cancelled()
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p data/output
          python3 scripts/gerar_email.py || echo "⚠ Geração do e-mail falhou — fallback para texto plano"
          if [ -f data/output/email_body.html ]; then
            echo "EMAIL_HTML_BODY<<HTMLEOF" >> $GITHUB_ENV
            cat data/output/email_body.html >> $GITHUB_ENV
            echo "HTMLEOF" >> $GITHUB_ENV
          fi

      - name: "📧 E-mail: ASVs atualizadas"
        if: success() && env.PIPELINE_STATUS == 'ok'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "✅ ASVs atualizadas — ${{ env.PIPELINE_N_ALERTAS }} fragmentos | SINAFLOR+ (PI)"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "Pipeline de ASVs SINAFLOR+ executado com sucesso. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📧 E-mail: ASVs com avisos"
        if: success() && env.PIPELINE_STATUS == 'warning'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "⚠️ ASVs com avisos — download WFS parcial ou cache usado"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "Pipeline de ASVs concluído com avisos. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📧 E-mail: falha no pipeline de ASVs"
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "CGEO Monitoramento <${{ secrets.MAIL_USERNAME }}>"
          subject: "🚨 FALHA — Pipeline ASVs SINAFLOR+ (run #${{ github.run_number }})"
          html_body: ${{ env.EMAIL_HTML_BODY }}
          body: "O pipeline de ASVs SINAFLOR+ falhou. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
