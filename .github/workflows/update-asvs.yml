name: "Atualização Semanal — ASVs SINAFLOR"

# Executa toda segunda-feira às 03:00 UTC
# ASVs são emitidas continuamente — atualização semanal garante cobertura.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas baixa dados, não executa pipeline (true/false)"
        required: false
        default: "false"

concurrency:
  group: update-asvs
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

jobs:
  update-asvs:
    name: "Baixar ASVs → Pipeline → Upload"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: desmatamento
          environment-file: environment.yml
          use-mamba: true
          miniforge-version: latest

      - name: Criar .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            > .env
          chmod 600 .env

      - name: Download ASVs SINAFLOR
        id: download-asvs
        # continue-on-error: serviço IBAMA pode estar temporariamente indisponível.
        # O passo seguinte verifica se há dados (novos ou cache) e decide se prossegue.
        continue-on-error: true
        run: conda run -n desmatamento python -m modules.asvs_sinaflor.downloader

      # Auditoria 2026-06-03: tornar este step resiliente.
      # WFS IBAMA cai com frequencia; nao queremos que o workflow inteiro
      # falhe quando isso acontece — basta sinalizar via outputs e pular
      # as etapas seguintes. Run mensal de update-alertas reabsorve a ASV
      # quando o servico voltar.
      - name: Verificar arquivo ASV
        id: verify-asv
        run: |
          python -c "
          from pathlib import Path
          import json, os
          p = Path('data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson')
          gh_output = os.environ.get('GITHUB_OUTPUT', '')
          def emit(key, val):
              if gh_output:
                  with open(gh_output, 'a') as f:
                      f.write(f'{key}={val}\n')
          if not p.exists():
              print('AVISO: ASVs nao disponiveis (WFS IBAMA indisponivel e sem cache).')
              print('Pipeline sera pulado — proxima execucao tenta de novo.')
              emit('disponivel', 'false')
              emit('n_features', '0')
              raise SystemExit(0)  # sai com status 0 — nao falha o workflow
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              n = len(data.get('features', []))
          except Exception as exc:
              print(f'AVISO: GeoJSON ASV corrompido: {exc}')
              emit('disponivel', 'false')
              emit('n_features', '0')
              raise SystemExit(0)
          print(f'OK: {n} ASVs disponiveis')
          emit('disponivel', 'true')
          emit('n_features', str(n))
          if n == 0:
              print('AVISO: WFS IBAMA respondeu, mas sem ASVs — pulando re-execucao')
              emit('disponivel', 'false')
          if '${{ steps.download-asvs.outcome }}' == 'failure':
              print('AVISO: Download falhou — usando arquivo de cache.')
          "

      # Só re-executa o pipeline completo se os dados mudaram
      # (verifica hash do arquivo de ASVs)
      - name: Verificar se ASVs mudaram
        id: check-change
        if: steps.verify-asv.outputs.disponivel == 'true'
        run: |
          if [ -f "data/output/.last_asv_hash" ]; then
            OLD=$(cat data/output/.last_asv_hash)
            NEW=$(md5sum "data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson" | cut -d' ' -f1)
            if [ "$OLD" = "$NEW" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "ASVs sem mudança desde último download — pipeline não será re-executado"
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Download DERADSAs (Supabase Storage)
        if: steps.check-change.outputs.changed == 'true'
        run: conda run -n desmatamento python -m modules.deradsa_semarh.downloader
        continue-on-error: true

      - name: Download MapBiomas Alertas (reutilizar existente)
        if: steps.check-change.outputs.changed == 'true'
        run: |
          python -c "
          from pathlib import Path
          import time
          p = Path('data/raw/Alertas de Desmatamento(MAPBIOMAS).geojson')
          if p.exists():
              age_days = (time.time() - p.stat().st_mtime) / 86400
              print(f'Alertas existentes: {age_days:.1f} dias de idade')
              if age_days < 7:
                  print('Reutilizando arquivo existente (< 7 dias)')
              else:
                  print('Arquivo antigo (> 7 dias) — executar update-alertas.yml')
          else:
              raise SystemExit('ERRO: Alertas MapBiomas não encontrados. Execute update-alertas.yml primeiro.')
          "

      - name: Executar Orquestrador v2
        if: ${{ steps.check-change.outputs.changed == 'true' && github.event.inputs.dry_run != 'true' }}
        run: conda run -n desmatamento python -m core.orchestrator

      - name: Salvar hash das ASVs
        if: steps.check-change.outputs.changed == 'true'
        run: |
          mkdir -p data/output
          md5sum "data/raw/ASVs Emitidas-PI(SINAFLOR+).geojson" | cut -d' ' -f1 > data/output/.last_asv_hash

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asv-update-${{ github.run_number }}
          path: data/output/pipeline.log
          retention-days: 14

      # ── Resumo da execução (GitHub Actions Summary) ─────────────────────
      - name: Resumo da execução
        if: always()
        run: |
          STATUS="${PIPELINE_STATUS:-desconhecido}"
          case "$STATUS" in
            ok)      ICONE="✅" ; LABEL="CONCLUÍDO" ;;
            warning) ICONE="⚠️" ; LABEL="COM AVISOS" ;;
            error)   ICONE="🚨" ; LABEL="COM ERROS"  ;;
            *)       ICONE="❓" ; LABEL="DESCONHECIDO" ;;
          esac

          {
            echo "## $ICONE ASVs SINAFLOR+ — $LABEL"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Fragmentos re-classificados | ${PIPELINE_N_ALERTAS:-—} |"
            echo "| Municípios afetados         | ${PIPELINE_N_MUN:-—} |"
            echo "| Duração                     | ${PIPELINE_DURACAO:-—}s |"
            echo "| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            if [ -n "$PIPELINE_RESUMO_MODULOS" ]; then
              echo "### Módulos"
              echo '```'
              echo "$PIPELINE_RESUMO_MODULOS"
              echo '```'
            fi
            if [ -n "$PIPELINE_AVISOS" ] && [ "$PIPELINE_AVISOS" != "Nenhum" ]; then
              echo "### ⚠ Avisos"
              echo '```'
              echo "$PIPELINE_AVISOS"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY
