name: "Atualização Mensal — Cicatrizes Queimadas (AQ1km INPE)"

# BD Queimadas/INPE publica AQ1km Coleção 2 mensalmente até o início do mês
# seguinte. Rodamos no dia 5 às 04:00 UTC para garantir disponibilidade do
# arquivo do mês anterior. Também acionável manualmente.
on:
  schedule:
    - cron: "0 4 5 * *"
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a processar (default: ano corrente)"
        required: false
        default: ""
      skip_download:
        description: "Reutilizar ZIPs já baixados em data/raw/queimadas (true/false)"
        required: false
        default: "false"

concurrency:
  group: update-queimadas
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

jobs:
  update-queimadas:
    name: "Download BD-Queimadas → Pipeline queimadas_bdq → Upload"
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 12 ZIPs mensais + overlay vetorial

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar secrets obrigatorios
        run: |
          set -eu
          missing=""
          for s in SUPABASE_URL SUPABASE_SERVICE_KEY SUPABASE_ANON_KEY; do
            v="$(eval echo \"\${$s:-}\")"
            if [ -z "$v" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes:$missing"
            echo "## ❌ Secrets ausentes" >> "$GITHUB_STEP_SUMMARY"
            for s in $missing; do echo "- \`$s\`" >> "$GITHUB_STEP_SUMMARY"; done
            exit 1
          fi
          echo "✓ Secrets presentes"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: desmatamento
          environment-file: environment.yml
          use-mamba: true
          miniforge-version: latest

      - name: Criar .env
        run: |
          printf '%s\n' \
            "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "REDD_DATA_ROOT=${{ github.workspace }}/data" \
            > .env
          chmod 600 .env

      - name: Resolver ano alvo
        id: ano
        run: |
          INPUT_ANO="${{ github.event.inputs.ano }}"
          if [ -z "$INPUT_ANO" ]; then
            ANO=$(date -u +%Y)
          else
            ANO="$INPUT_ANO"
          fi
          echo "ano=$ANO" >> "$GITHUB_OUTPUT"
          echo "Ano alvo: $ANO"

      # ── Pré-requisito: GPKG de classes AHP ─────────────────────────────────
      # O módulo queimadas_bdq cruza com `classes_prioritarias.gpkg` produzido
      # localmente pelo módulo areas_prioritarias (~470 MB) — não pode ser
      # gerado no runner. Distribuímos via GitHub Release.
      #
      # Setup (uma vez):
      #   1. Converter SHP → GPKG no PC com o env desmatamento:
      #        ogr2ogr -f GPKG classes_prioritarias.gpkg \
      #                "C:/11. REDD+/16_prioridade_classes_final/classes_prioritarias-REDD+.shp"
      #   2. Publicar como Release asset:
      #        gh release create data-assets-v1 classes_prioritarias.gpkg \
      #          --title "Data assets v1 (GPKG classes prioritárias)" --notes "..."
      #   3. Adicionar secret QB_GPKG_URL apontando para o asset:
      #        gh secret set QB_GPKG_URL --body "https://github.com/HerculesFer1/.../classes_prioritarias.gpkg"
      #
      # Se QB_GPKG_URL estiver vazio, o workflow falha aqui com erro visível
      # (em vez de o orchestrator abortar silenciosamente em 0,3s).
      - name: Baixar GPKG de classes prioritárias (Release asset)
        env:
          QB_GPKG_URL: ${{ secrets.QB_GPKG_URL }}
        run: |
          set -euo pipefail
          if [ -z "${QB_GPKG_URL:-}" ]; then
            echo "::error::Secret QB_GPKG_URL ausente."
            echo "::error::Publique classes_prioritarias.gpkg num GitHub Release e configure o secret."
            echo "## ❌ QB_GPKG_URL ausente" >> "$GITHUB_STEP_SUMMARY"
            echo "Veja o comentário no workflow update-queimadas.yml para o setup." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # core/config.py:63 espera o GPKG em REDD_DATA_ROOT/16_prioridade_classes_final/
          DEST_DIR="data/16_prioridade_classes_final"
          DEST="$DEST_DIR/classes_prioritarias.gpkg"
          mkdir -p "$DEST_DIR"
          echo "Baixando classes_prioritarias.gpkg de Release asset → $DEST"
          curl -fsSL -o "$DEST" "$QB_GPKG_URL"
          SIZE=$(stat -c%s "$DEST")
          echo "✓ Baixado: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Arquivo baixado tem menos de 1 MB — provável erro 404 ou redirect inválido."
            exit 1
          fi

      # ── Executar pipeline do módulo ──────────────────────────────────────
      - name: Executar Orquestrador — módulo queimadas_bdq
        env:
          SKIP_DL: ${{ github.event.inputs.skip_download }}
        run: |
          set -euo pipefail
          ARGS="--module queimadas_bdq --ano ${{ steps.ano.outputs.ano }}"
          if [ "$SKIP_DL" = "true" ]; then ARGS="$ARGS --skip-download"; fi
          # Sanity check anti-no-op: capturamos stdout para detectar se o
          # módulo abortou cedo em silêncio (causa raiz do cron 2026-06-05
          # — terminava em 0,3s sem processar nada).
          LOG=$(mktemp)
          conda run -n desmatamento python -m core.orchestrator $ARGS 2>&1 | tee "$LOG"
          STATUS="${PIPESTATUS[0]}"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Orchestrator falhou com exit code $STATUS"
            exit "$STATUS"
          fi
          # No-op detection: pipeline real grava "registros inseridos" no log.
          if ! grep -qE "registros inseridos|Upload queimadas_bdq concluído" "$LOG"; then
            echo "::error::Orchestrator terminou sem evidência de upload — provável no-op silencioso."
            tail -30 "$LOG"
            exit 1
          fi

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queimadas-update-${{ steps.ano.outputs.ano }}-${{ github.run_number }}
          path: |
            data/output/pipeline.log
            data/output/qb_*.json
          retention-days: 60

      - name: Resumo da execução
        if: always()
        run: |
          echo "## Atualização BD-Queimadas INPE — Ano ${{ steps.ano.outputs.ano }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/output/pipeline.log" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(ETAPA|✓|qb_|cicatrizes|meses)" data/output/pipeline.log \
              | tail -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
