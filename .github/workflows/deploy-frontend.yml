name: "Deploy Frontend — Vercel"

# Deploy automático quando frontend/ muda no main.
# PRs geram preview deployment; push para main faz deploy de produção.
on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "frontend/**"

# ── Segredos necessários (configurar em: Settings > Secrets > Actions) ──────
# VERCEL_TOKEN        → Vercel Dashboard > Account Settings > Tokens
# VERCEL_ORG_ID       → .vercel/project.json (após `vercel link`) → "orgId"
# VERCEL_PROJECT_ID   → .vercel/project.json (após `vercel link`) → "projectId"
# VITE_SUPABASE_URL   → valor de SUPABASE_URL do .env (sem service key)
# VITE_SUPABASE_ANON_KEY → valor da anon key pública do Supabase

jobs:
  deploy:
    name: "Build & Deploy → Vercel"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Instalar dependências ─────────────────────────────────────────────
      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      # ── 4. Build de produção ─────────────────────────────────────────────────
      # VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY são injetadas em build-time.
      # São valores PÚBLICOS (anon key) — seguro expor no bundle do frontend.
      # NUNCA usar SUPABASE_SERVICE_KEY aqui.
      - name: Build de produção
        run: npm run build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── 5. Deploy para Vercel ────────────────────────────────────────────────
      - name: Deploy para Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          # push para main → produção; PRs → preview automático
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}

      # ── 6. Comentar URL no PR ────────────────────────────────────────────────
      - name: Comentar URL do preview no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview-url }}';
            if (url) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview do dashboard disponível:**\n${url}\n\n*Deploy automático via Vercel — GCGEO/SEMARH-PI*`,
              });
            }
