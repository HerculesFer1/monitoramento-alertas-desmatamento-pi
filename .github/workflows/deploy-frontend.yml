name: "Deploy Frontend — Vercel"

# Deploy automático quando frontend/ muda no main.
# PRs geram preview deployment; push para main faz deploy de produção.
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "frontend/**"

# ── Segredos necessários (configurar em: Settings > Secrets > Actions) ──────
# VERCEL_TOKEN        → Vercel Dashboard > Account Settings > Tokens
# VERCEL_ORG_ID       → .vercel/project.json (após `vercel link`) → "orgId"
# VERCEL_PROJECT_ID   → .vercel/project.json (após `vercel link`) → "projectId"
# VITE_SUPABASE_URL   → valor de SUPABASE_URL do .env (sem service key)
# VITE_SUPABASE_ANON_KEY → valor da anon key pública do Supabase

jobs:
  deploy:
    name: "Build & Deploy → Vercel"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Instalar dependências ─────────────────────────────────────────────
      - name: Instalar dependências
        run: npm install
        working-directory: frontend

      # ── 4. Build de produção ─────────────────────────────────────────────────
      # VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY são injetadas em build-time.
      # São valores PÚBLICOS (anon key) — seguro expor no bundle do frontend.
      # NUNCA usar SUPABASE_SERVICE_KEY aqui.
      - name: Build de produção
        run: npm run build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Sentry — opcional: ativo somente quando o secret existir.
          # Criar em: https://sentry.io > New Project > React → copiar DSN.
          # Adicionar em: GitHub > Settings > Secrets > VITE_SENTRY_DSN
          VITE_SENTRY_DSN:        ${{ secrets.VITE_SENTRY_DSN }}

      # ── 5. Deploy para Vercel (CLI da raiz — o projeto já tem root=frontend) ───
      - name: Deploy para Vercel
        id: deploy
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Sanity check anti-no-op (padrão de update-queimadas.yml).
          # Bug histórico: CLI vercel saía 0 com warning "cannot-load-project-settings"
          # quando VERCEL_ORG_ID/PROJECT_ID estavam desatualizados, e o workflow
          # marcava success sem deployar. Pegamos esses sinais no stdout.
          LOG=$(mktemp)
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel@latest --token=$VERCEL_TOKEN --prod --yes 2>&1 | tee "$LOG"
          else
            npx vercel@latest --token=$VERCEL_TOKEN --yes 2>&1 | tee "$LOG"
          fi
          STATUS="${PIPESTATUS[0]}"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Vercel CLI falhou com exit code $STATUS"
            exit "$STATUS"
          fi

          # Detecta padrões de erro silencioso da CLI Vercel
          if grep -qiE "cannot-load-project-settings|not authorized|invalid token|project not found" "$LOG"; then
            echo "::error::Vercel CLI reportou erro silencioso (exit 0 mas com warning crítico):"
            grep -iE "cannot|invalid|not authorized|not found" "$LOG" | head -5
            echo "::error::Verifique secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID."
            echo "::error::Reparar com: scripts/setup-vercel.ps1"
            exit 1
          fi

          # Deploy URL é a última linha que começa com https://
          DEPLOY_URL=$(grep -oE 'https://[a-z0-9._-]+\.vercel\.app[^ ]*' "$LOG" | tail -1)
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "::error::Não foi possível extrair URL do deploy do output do CLI."
            tail -10 "$LOG"
            exit 1
          fi
          echo "preview-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "✓ Deploy concluído: $DEPLOY_URL"

      # ── 6. Comentar URL no PR ────────────────────────────────────────────────
      - name: Comentar URL do preview no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview-url }}';
            if (url) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: 'Deploy do dashboard disponível: ' + url + '\n\nDeploy automatico via Vercel — CGEO/SEMARH-PI',
              });
            }
